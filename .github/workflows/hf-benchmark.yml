name: Hugging Face RCA benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hf-benchmark.yml

permissions:
  contents: read

jobs:
  case:
    name: HF case ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        case: ['001', '002', '003', '004', '005', '006', '007', '008', '009', '010', '011', '012', '013', '014']
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ETAG_TIMEOUT: '120'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned inference runtime
        run: |
          python -m pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --only-binary=llama-cpp-python 'llama-cpp-python==0.3.36'
          python -m pip install -e '.[hf]'
      - name: Generate and seal predictions without scoring
        run: python scripts/hf_case_job.py --case-id '${{ matrix.case }}'
      - uses: actions/upload-artifact@v4
        with:
          name: hf-case-${{ matrix.case }}
          path: .runs/public-case-artifact/*.json
          retention-days: 7
          if-no-files-found: error

  collect:
    name: Score all 56 sealed predictions
    needs: case
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned upstream scorer
        run: python -m pip install -e '.[llm]'
      - uses: actions/download-artifact@v4
        with:
          pattern: hf-case-*
          path: .runs/downloaded-hf-artifacts
      - name: Verify complete schedule and score
        run: python scripts/hf_collect_jobs.py --artifacts .runs/downloaded-hf-artifacts --output results/hf-actions-${{ github.run_id }}
      - name: Save measured results to this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/hf-actions-${{ github.run_id }}
          git commit -m 'results: publish completed Hugging Face RCA measurement'
          git pull --rebase origin main
          git push origin HEAD:main
