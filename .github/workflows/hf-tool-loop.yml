name: HF original RCA tool loop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case:
    name: HF loop case ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        case: ['001', '002', '003', '004', '005', '006', '007', '008', '009', '010', '011', '012', '013', '014']
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ETAG_TIMEOUT: '120'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      PYTHONHASHSEED: '0'
      GREPTIMEDB_STANDALONE__ENABLE_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local HF inference and original SDK
        run: |
          python -m pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --only-binary=llama-cpp-python 'llama-cpp-python==0.3.36'
          python -m pip install -e '.[hf,llm]'
      - name: Real source preflight, candidate selection and LLM investigation
        run: python scripts/hf_loop_case.py --case-id '${{ matrix.case }}'
      - uses: actions/upload-artifact@v4
        with:
          name: hf-loop-case-${{ matrix.case }}
          path: .runs/public-hf-loop-case/*.json
          retention-days: 14
          if-no-files-found: error

  collect:
    name: Verify all 56 investigations and rescore
    needs: case
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[llm]'
      - uses: actions/download-artifact@v4
        with:
          pattern: hf-loop-case-*
          path: .runs/downloaded-hf-loop
      - name: Independent official diagnosis rescore and complete-cohort report
        run: python scripts/hf_loop_collect.py --artifacts .runs/downloaded-hf-loop --output results/hf-tool-loop-${{ github.run_id }}
      - name: Publish measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/hf-tool-loop-${{ github.run_id }}
          git commit -m 'results: publish Hugging Face original-loop RCA measurement'
          git pull --rebase origin main
          git push origin HEAD:main
