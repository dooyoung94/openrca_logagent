name: Score existing sealed HF predictions

on:
  push:
    paths:
      - .github/workflows/hf-rescore.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed inference workflow run
        required: true
        default: '39402033849'
      source_commit:
        description: Frozen inference source commit
        required: true
        default: '9653684a77395451687dec51df2cb11c9c7cb9d7'

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_SOURCE_RUN: ${{ inputs.source_run_id || '39402033849' }}
      HF_SOURCE_COMMIT: ${{ inputs.source_commit || '9653684a77395451687dec51df2cb11c9c7cb9d7' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original scorer on its supported Python
        run: python -m pip install -e '.[llm]'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.HF_SOURCE_RUN }}
          pattern: hf-case-*
          path: .runs/downloaded-hf-artifacts
      - name: Verify all 56 predictions and score without model calls
        run: python scripts/hf_collect_jobs.py --artifacts .runs/downloaded-hf-artifacts --output "results/hf-actions-${HF_SOURCE_RUN}" --source-commit "$HF_SOURCE_COMMIT" --source-run-id "$HF_SOURCE_RUN"
      - name: Save measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "results/hf-actions-${HF_SOURCE_RUN}"
          git commit -m 'results: publish completed Hugging Face RCA measurement'
          git pull --rebase origin main
          git push origin HEAD:main
